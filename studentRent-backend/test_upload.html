<!DOCTYPE html>
<html lang="en">
<head>
    <title>Upload Test</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Test Image Upload</h2>
    
    <form id="uploadForm">
        <label>1. Paste your JWT Token:</label><br>
        <input type="text" id="token" style="width: 400px;" required><br><br>

        <label>2. Paste your Property ID:</label><br>
        <input type="text" id="property_id" style="width: 400px;" required><br><br>

        <label>3. Select an Image:</label><br>
        <input type="file" id="image" accept="image/*" required><br><br>

        <button type="submit" style="padding: 10px 20px;">Upload Image</button>
    </form>

    <pre id="responseOutput" style="background: #eee; padding: 10px; margin-top: 20px;"></pre>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop page from refreshing
            
            const token = document.getElementById('token').value;
            const propertyId = document.getElementById('property_id').value;
            const imageFile = document.getElementById('image').files[0];

            // Build the form data exactly like Thunder Client would
            const formData = new FormData();
            formData.append('property_id', propertyId);
            formData.append('image', imageFile);

            try {
                const response = await fetch('http://localhost:8000/api/properties/upload_image.php', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    },
                    body: formData // Fetch automatically sets the correct multipart headers
                });

                const result = await response.json();
                document.getElementById('responseOutput').innerText = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('responseOutput').innerText = "Error connecting to server.";
            }
        });
    </script>
</body>
</html>
